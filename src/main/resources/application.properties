spring.application.name=flowforge
server.port=8080

# Backend servers
flowforge.backends[0].id=backend-1
flowforge.backends[0].url=http://localhost:8081
flowforge.backends[0].weight=1

flowforge.backends[1].id=backend-2
flowforge.backends[1].url=http://localhost:8082
flowforge.backends[1].weight=1

# Load balancing strategy
flowforge.load-balancer.strategy=WEIGHTED_ROUND_ROBIN

# Health endpoint
management.endpoints.web.exposure.include=health,info

flowforge.backend.name=flowforge