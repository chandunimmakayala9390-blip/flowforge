spring.application.name=flowforge
server.port=8080

# Backend servers
flowforge.backends[0].id=backend-1
flowforge.backends[0].url=http://localhost:8081
flowforge.backends[0].weight=1

flowforge.backends[1].id=backend-2
flowforge.backends[1].url=http://localhost:8082
flowforge.backends[1].weight=1

# ROUND_ROBIN, WEIGHTED_ROUND_ROBIN, or LEAST_CONNECTIONS
flowforge.load-balancer.strategy=WEIGHTED_ROUND_ROBIN

# Bound network wait times to avoid tying up request threads indefinitely.
flowforge.proxy.connect-timeout-ms=1000
flowforge.proxy.read-timeout-ms=3000
flowforge.proxy.max-attempts=2

# Schedule health probes and keep each probe bounded.
flowforge.health-check.interval-ms=5000
flowforge.health-check.timeout-ms=800

management.endpoints.web.exposure.include=health,info
flowforge.backend.name=flowforge
